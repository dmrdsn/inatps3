name: Build PS3 PKG

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_pkg:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set environment
        run: |
          echo "sha_name=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV
          echo "PS3DEV=${GITHUB_WORKSPACE}/ps3dev" >> $GITHUB_ENV
          echo "PSL1GHT=${GITHUB_WORKSPACE}/ps3dev" >> $GITHUB_ENV
          echo "${GITHUB_WORKSPACE}/ps3dev/bin" >> $GITHUB_PATH
          echo "${GITHUB_WORKSPACE}/ps3dev/ppu/bin" >> $GITHUB_PATH
          sudo apt-get update -qq
          sudo apt-get install -y -qq python2.7 xz-utils || true
          command -v python2 || sudo ln -sf /usr/bin/python2.7 /usr/local/bin/python2

      # Pre-built PSL1GHT SDK (toolchain + PSL1GHT + ps3libraries: curl, polarssl, freetype, tiny3d...)
      - name: Download PSL1GHT toolchain
        run: |
          curl -sL https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz | tar xz -C ./
          curl -sL https://github.com/ps3dev/PSL1GHT/raw/master/ppu/include/sysutil/sysutil.h -o ps3dev/ppu/include/sysutil/sysutil.h
          ls ps3dev/portlibs/ppu/lib | head -50

      - name: Cache FFmpeg
        id: ffcache
        uses: actions/cache@v4
        with:
          path: ffmpeg-ppu
          key: ffmpeg-ppu-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg for PPU
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          bash scripts/build-ffmpeg.sh "${GITHUB_WORKSPACE}/ffmpeg-ppu"

      - name: Install FFmpeg into portlibs
        run: |
          cp -r ffmpeg-ppu/include/* ps3dev/portlibs/ppu/include/
          cp -r ffmpeg-ppu/lib/*.a ps3dev/portlibs/ppu/lib/

      - name: Build package
        run: |
          make pkg
          ls -la *.pkg

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: M3UPlayer-ps3-${{ env.sha_name }}
          path: |
            M3UPlayer.pkg
            M3UPlayer.gnpdrm.pkg
          if-no-files-found: error
